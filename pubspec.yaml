name: khabroom
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+10

environment:
  sdk: ^3.12.1
  flutter: ^3.44.1

dependencies:
  flutter:
    sdk: flutter

  u:
    path: U_flutter


dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "lib/assets/images/logo_launcher.png"
  min_sdk_android: 23
  ios:
    generate: true
    remove_alpha_ios: true
    image_path: "lib/assets/images/logo_launcher.png"
    background_color: "#B45309"
    theme_color: "#B45309"
  web:
    generate: true
    image_path: "lib/assets/images/logo_launcher.png"
    background_color: "#B45309"
    theme_color: "#B45309"
  windows:
    generate: true
    image_path: "lib/assets/images/logo_launcher.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "lib/assets/images/logo_launcher.png"

flutter:
  uses-material-design: true
  assets:
    - lib/assets/
    - lib/assets/images/
    - lib/assets/icons/
